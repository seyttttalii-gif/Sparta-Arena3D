name: Sparta Arena Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ZIP dosyasini bul ve ac
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Filter "*.zip" `
            -File |
            Select-Object -First 1

          if (-not $zip) {
            throw "Depoda ZIP dosyasi bulunamadi."
          }

          Write-Host "Bulunan ZIP: $($zip.Name)"

          $gameDir = Join-Path $env:GITHUB_WORKSPACE "game"
          New-Item -ItemType Directory -Path $gameDir -Force | Out-Null

          Expand-Archive `
            -LiteralPath $zip.FullName `
            -DestinationPath $gameDir `
            -Force

          $main = Get-ChildItem `
            -Path $gameDir `
            -Filter "main.py" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $main) {
            Write-Host "ZIP icindeki dosyalar:"
            Get-ChildItem $gameDir -Recurse -File |
              Select-Object -First 100 -ExpandProperty FullName
            throw "ZIP icinde main.py bulunamadi."
          }

          $projectDir = $main.DirectoryName
          Write-Host "Oyun klasoru: $projectDir"

          "PROJECT_DIR=$projectDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Python paketlerini kur
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          python -m pip install pygame ursina pyinstaller

          $requirements = Join-Path $env:PROJECT_DIR "requirements.txt"

          if (Test-Path $requirements) {
            python -m pip install -r $requirements
            if ($LASTEXITCODE -ne 0) {
              throw "requirements.txt paketleri kurulamadi."
            }
          }

      - name: Windows EXE dosyasini derle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          $workDir = Join-Path $env:GITHUB_WORKSPACE "build-temp"

          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null

          $pyiArgs = @(
            "--noconfirm",
            "--clean",
            "--windowed",
            "--onedir",
            "--name", "SpartaArena",
            "--distpath", $distDir,
            "--workpath", $workDir,
            "--collect-all", "ursina",
            "--collect-all", "panda3d"
          )

          Get-ChildItem -Path $env:PROJECT_DIR -Directory |
            Where-Object {
              $_.Name -notin @(
                ".git", ".github", "__pycache__",
                "build", "dist", ".venv", "venv"
              )
            } |
            ForEach-Object {
              $pyiArgs += @(
                "--add-data",
                "$($_.FullName);$($_.Name)"
              )
            }

          Get-ChildItem -Path $env:PROJECT_DIR -File |
            Where-Object {
              $_.Extension -notin @(".py", ".pyc", ".spec") -and
              $_.Name -ne "requirements.txt"
            } |
            ForEach-Object {
              $pyiArgs += @(
                "--add-data",
                "$($_.FullName);."
              )
            }

          $mainPath = Join-Path $env:PROJECT_DIR "main.py"
          $pyiArgs += $mainPath

          python -m PyInstaller @pyiArgs

          if ($LASTEXITCODE -ne 0) {
            throw "Windows derlemesi basarisiz oldu."
          }

          $exe = Join-Path $distDir "SpartaArena\SpartaArena.exe"

          if (-not (Test-Path $exe)) {
            throw "Derleme tamamlandi ancak EXE dosyasi bulunamadi."
          }

          Write-Host "EXE hazir: $exe"

      - name: Windows oyununu cikti olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-Windows
          path: dist/SpartaArena/
          if-no-files-found: error
