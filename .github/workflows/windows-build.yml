name: Sparta Arena 3D Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kaynak ZIP dosyasını aç ve yolu doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'SpartaArena_3D_PC_Kaynak.zip'
          if (!(Test-Path $zip)) {
            throw 'SpartaArena_3D_PC_Kaynak.zip bulunamadı. Kaynak paketini deponun ana dizinine yükleyip Commit changes yap.'
          }
          $unpack = Join-Path $env:RUNNER_TEMP 'SpartaArenaSource'
          Remove-Item $unpack -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $unpack -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $unpack -Force
          $src = Join-Path $unpack 'SpartaArena_3D_PC'
          if (!(Test-Path (Join-Path $src 'main.py'))) { throw 'ZIP içinde 3D main.py bulunamadı.' }
          if (!(Test-Path (Join-Path $src 'legacy_v57/main.py'))) { throw 'V57 tam oyun kodu bulunamadı.' }
          if (!(Test-Path (Join-Path $src 'requirements-build.txt'))) { throw 'requirements-build.txt bulunamadı.' }
          "SPARTA_SOURCE_DIR=$src" >> $env:GITHUB_ENV
          Write-Host "Kaynak yolu: $src"

      - name: Bağımlılıkları kur ve kaynakları kontrol et
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip güncellenemedi.' }
          python -m pip install -r "$env:SPARTA_SOURCE_DIR\requirements-build.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Panda3D/Pygame/PyInstaller kurulamadı.' }
          python -m py_compile "$env:SPARTA_SOURCE_DIR\main.py" "$env:SPARTA_SOURCE_DIR\legacy_v57\main.py"
          if ($LASTEXITCODE -ne 0) { throw 'Python kaynak kodu kontrolünden geçemedi.' }

      - name: Gerçek 3D PC EXE oluştur
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = $env:SPARTA_SOURCE_DIR
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Push-Location $src
          try {
            python -m PyInstaller `
              --noconfirm --clean --onefile --windowed `
              --name SpartaArena `
              --collect-all panda3d --collect-all direct `
              --add-data "$src\assets;assets" `
              --icon (Join-Path $src 'assets\SpartaArena.ico') `
              --distpath $dist `
              --workpath (Join-Path $env:RUNNER_TEMP 'build-panda') `
              --specpath (Join-Path $env:RUNNER_TEMP 'spec-panda') `
              main.py 2>&1 | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'build-3d.log')
            if ($LASTEXITCODE -ne 0) { throw '3D EXE derlemesi başarısız.' }
          } finally {
            Pop-Location
          }
          if (!(Test-Path (Join-Path $dist 'SpartaArena.exe'))) { throw 'SpartaArena.exe oluşmadı.' }

      - name: V57 tam içerik EXE oluştur
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = $env:SPARTA_SOURCE_DIR
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          Push-Location $src
          try {
            python -m PyInstaller `
              --noconfirm --clean --onefile --windowed `
              --name SpartaArenaV57 `
              --collect-all pygame `
              --add-data "$src\legacy_v57\assets;assets" `
              --icon (Join-Path $src 'legacy_v57\assets\SpartaArena.ico') `
              --distpath $dist `
              --workpath (Join-Path $env:RUNNER_TEMP 'build-pygame') `
              --specpath (Join-Path $env:RUNNER_TEMP 'spec-v57') `
              (Join-Path $src 'legacy_v57\main.py') 2>&1 | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'build-v57.log')
            if ($LASTEXITCODE -ne 0) { throw 'V57 EXE derlemesi başarısız.' }
          } finally {
            Pop-Location
          }
          if (!(Test-Path (Join-Path $dist 'SpartaArenaV57.exe'))) { throw 'SpartaArenaV57.exe oluşmadı.' }

      - name: Windows paketini hazırla
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item (Join-Path $env:SPARTA_SOURCE_DIR 'README_TR.md') 'dist/README_TR.md' -Force
          Compress-Archive -Path @('dist/SpartaArena.exe','dist/SpartaArenaV57.exe','dist/README_TR.md') `
            -DestinationPath 'SpartaArena-3D-PC.zip' -Force
          Get-Item 'SpartaArena-3D-PC.zip' | Format-List Name,Length

      - name: EXE paketini ve derleme günlüklerini kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-Windows-3D
          path: |
            SpartaArena-3D-PC.zip
            build-3d.log
            build-v57.log
          if-no-files-found: warn
          retention-days: 14
